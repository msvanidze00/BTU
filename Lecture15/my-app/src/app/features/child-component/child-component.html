<div class="wrapper">
  <h1>This is child componen</h1>
  <p>Here is the name from the parent {{ childInputName() }}</p>

  <button (click)="increment()">Increment</button>
  <span>{{ value() }}</span>
  <button (click)="decrement()">Decrement</button>

  <button (click)="formSubmit()">To emit</button>

  <p [ngClass]="{ 'active-text': isActive() }">this text changes color</p>

  <p [ngStyle]="{ color: isActive() ? 'green' : 'red' }">this text changes color</p>

  <p>{{ 'hello' | uppercase }}</p>
  <button (click)="toggle()">this button changes color</button>
</div>
