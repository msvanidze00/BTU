<div>
  <h1>Card page</h1>
  <!-- <app-card
    [cardTitle]="title"

  <div class="wrapper">
    @for (card of cardData; track card.price) {
      <app-card
        [cardTitle]="card.title"
        [cardDescription]="card.description"
        [cardContent]="card.content"
        [cardPrice]="card.price"
      >
      </app-card>
    }
  </div>
</div>
